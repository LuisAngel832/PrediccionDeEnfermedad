<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predicción de Enfermedad Cardíaca · Deep Learning</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>❤️ Predicción de Enfermedad Cardíaca</h1>
    <p>Red neuronal profunda (Deep Learning, varias capas) · Proyecto IA #4</p>
  </header>

  <main>
    <form id="formulario">
      <div class="grid">
        <label>Edad (años)
          <input type="number" name="age" value="63" required />
        </label>

        <label>Sexo
          <select name="sex">
            <option value="1">Hombre</option>
            <option value="0">Mujer</option>
          </select>
        </label>

        <label>Tipo de dolor de pecho (cp)
          <select name="cp">
            <option value="0">0 - Angina típica</option>
            <option value="1">1 - Angina atípica</option>
            <option value="2">2 - Dolor no anginoso</option>
            <option value="3" selected>3 - Asintomático</option>
          </select>
        </label>

        <label>Presión arterial en reposo (trestbps)
          <input type="number" name="trestbps" value="145" required />
        </label>

        <label>Colesterol (chol, mg/dl)
          <input type="number" name="chol" value="233" required />
        </label>

        <label>Azúcar en ayunas &gt; 120 (fbs)
          <select name="fbs">
            <option value="1">Sí</option>
            <option value="0">No</option>
          </select>
        </label>

        <label>Electrocardiograma reposo (restecg)
          <select name="restecg">
            <option value="0" selected>0 - Normal</option>
            <option value="1">1 - Anomalía ST-T</option>
            <option value="2">2 - Hipertrofia</option>
          </select>
        </label>

        <label>Frecuencia cardíaca máxima (thalach)
          <input type="number" name="thalach" value="150" required />
        </label>

        <label>Angina por ejercicio (exang)
          <select name="exang">
            <option value="0" selected>No</option>
            <option value="1">Sí</option>
          </select>
        </label>

        <label>Depresión ST (oldpeak)
          <input type="number" step="0.1" name="oldpeak" value="2.3" required />
        </label>

        <label>Pendiente ST (slope)
          <select name="slope">
            <option value="0" selected>0 - Ascendente</option>
            <option value="1">1 - Plana</option>
            <option value="2">2 - Descendente</option>
          </select>
        </label>

        <label>Vasos principales (ca)
          <select name="ca">
            <option value="0" selected>0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>

        <label>Talasemia (thal)
          <select name="thal">
            <option value="0">0</option>
            <option value="1" selected>1 - Normal</option>
            <option value="2">2 - Defecto fijo</option>
            <option value="3">3 - Defecto reversible</option>
          </select>
        </label>
      </div>

      <button type="submit">Predecir</button>
    </form>

    <section id="resultado" class="oculto">
      <h2 id="resultado-titulo"></h2>
      <p id="resultado-detalle"></p>
      <div class="barra"><div id="barra-relleno"></div></div>
    </section>
  </main>

  <footer>
    <p>Modelo entrenado con el dataset UCI Heart Disease · Sólo con fines educativos.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
